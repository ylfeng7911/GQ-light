
__include__: [
  '../dataset/MultiUAV_coco_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/gqdetr_r50vd.yml',
]


output_dir: ./output/rtdetr_r18vd_6x_coco

#会覆盖include配置中的同名配置
PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False      
  pretrained: False     #True
  
  conv1_improve: True
  basic_improve: True


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

  ifEncoder: False
  ifFCM: True


RTDETRTransformer:
  num_layers: 3 #3



optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      weight_decay: 0.
      lr: 0.00001
    - 
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    - 
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
