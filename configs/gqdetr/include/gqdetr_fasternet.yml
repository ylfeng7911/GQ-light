task: detection

model: RTDETR
criterion: RTDETRCriterion
postprocessor: RTDETRPostProcessor


use_focal_loss: True
eval_spatial_size: [640, 640] # h w


RTDETR: 
  backbone: FasterNet
  encoder: HybridEncoder
  decoder: RTDETRTransformer
  

FasterNet:
  name: t1    #t1
  return_idx: [0, 1, 2, 3]
  expand_ratio: 2
  pconv_n_div: 4
  pconv_forward_type: split_cat
  drop_path_rate: 0.0
  freeze_at: -1
  freeze_norm: False
  pretrained: False


HybridEncoder:
  in_channels: [128, 256, 512]   #t1:[128, 256, 512]    t0:[80, 160, 320]
  feat_strides: [8, 16, 32]           #4

  # intra
  hidden_dim: 256
  use_encoder_idx: [2]                #3
  num_encoder_layers: 1       #1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  
  # cross
  expansion: 0.5      #1.0
  depth_mult: 1
  act: 'silu'

  version: v1

RTDETRTransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3       #3

  num_layers: 3
  num_queries: 300

  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0 # 1.0 0.4

  eval_idx: -1
  GQI_enable: True    #若GQI和CSAF均不enable，则模型等于RT-DETR
  GQI_num_layers: 2     #[0,6]
  CSAF_enable: True
  max_feat_c: 64        #最大特征图的通道数 t1:64  t0:40
  ifexport: True


RTDETRPostProcessor:
  num_top_queries: 300


RTDETRCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2}   #bbox=5,GIOU=2       loss_ar: 0, loss_NWD: 0
  losses: ['vfl', 'boxes']   # ,'ar', 'NWD'
  alpha: 0.75
  gamma: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}   #cost_bbox: 5, cost_giou: 2         cost_NWD: 0
    alpha: 0.25
    gamma: 2.0

